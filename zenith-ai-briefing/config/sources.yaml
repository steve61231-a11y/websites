# Zenith AI Morning Intelligence Engine — sources
#
# Add a source by adding an entry below. No code changes needed.
#   name:      unique display name
#   type:      rss | atom | youtube | reddit | github_releases | webpage | sitemap | json | search
#   url:       feed / page / endpoint URL (not needed for type: search)
#   category:  ai_lab | ai_news | business | africa | kenya | tools | research | community | search
#   priority:  1-10 (10 = most trusted/important). Used for ranking and choosing the primary source.
#   enabled:   false to switch a source off without deleting it
#   official:  true for primary sources (company blogs, regulators). ai_lab is official by default.
#
# Type-specific options:
#   webpage:  link_pattern (regex article URLs must match), min_title_length
#   sitemap:  link_pattern, max_child_sitemaps, fetch_titles
#   json:     items_path, fields {title,url,published,description,author}, url_template
#   search:   engine (google_news | bing_news), queries [..], region (KE/US/NG/ZA/GB), when (e.g. 2d)
#   reddit:   external_links_only (default true — keep only posts linking to an article)
#
# Test every source:   python -m app --check-sources
# Feeds move. If a source shows ✗ in health, fix or disable it here.

sources:

  # ───────────────────────── AI LABS (primary sources) ─────────────────────────
  - name: OpenAI
    type: rss
    url: https://openai.com/news/rss.xml
    category: ai_lab
    priority: 10

  - name: Anthropic
    type: webpage
    url: https://www.anthropic.com/news
    link_pattern: "/news/[a-z0-9-]+$"
    min_title_length: 15
    category: ai_lab
    priority: 10

