  # ───────────────────────── NEWS SEARCH (mass discovery) ─────────────────────────
  # News indexes catch stories from outlets we don't follow directly
  # (Business Daily, Nation, The Star, Reuters, Bloomberg…). Original sources win on duplicates.
  - name: Google News — Kenya AI & tech
    type: search
    engine: google_news
    region: KE
    when: 2d
    category: kenya
    priority: 7
    queries:
      - "artificial intelligence Kenya"
      - "AI Kenya business"
      - "Safaricom AI OR M-Pesa AI"
      - "Kenya bank AI OR digital lending Kenya"
      - "Kenya data protection AI OR Kenya ICT policy"

  - name: Google News — Africa AI
    type: search
    engine: google_news
    region: US
    when: 2d
    category: africa
    priority: 6
    queries:
      - "artificial intelligence Africa startup"
      - "Africa fintech AI"

  - name: Google News — AI business
    type: search
    engine: google_news
    region: US
    when: 1d
    category: ai_news
    priority: 6
    queries:
      - "AI agents enterprise launch"
      - "OpenAI OR Anthropic OR Google Gemini announces"
      - "AI customer service OR AI sales automation"
      - "AI marketing tool launch"

  - name: Bing News — AI small business
    type: search
    engine: bing_news
    region: US
    category: business
    priority: 5
    enabled: false   # optional second index; enable if Google News coverage is thin
    queries:
      - "AI small business"
      - "generative AI productivity tool"

  # ───────────────────────── TOOLS / PRODUCT UPDATES ─────────────────────────
  - name: Hacker News — AI launches
    type: json
    url: "https://hn.algolia.com/api/v1/search_by_date?query=AI&tags=show_hn&numericFilters=points>30"
    category: tools
    priority: 5
    items_path: hits
    fields: {title: title, url: url, published: created_at, author: author}

  - name: OpenAI Codex releases
    type: github_releases
    url: https://github.com/openai/codex/releases.atom
    category: tools
    priority: 3
    enabled: false   # very frequent minor releases — enable if you cover developer tools

  - name: Ollama releases
    type: github_releases
    url: https://github.com/ollama/ollama/releases.atom
    category: tools
    priority: 3
    enabled: false

  # ───────────────────────── RESEARCH ─────────────────────────
  - name: Hugging Face Daily Papers
    type: json
    url: https://huggingface.co/api/daily_papers
    category: research
    priority: 4
    items_path: ""
    fields: {title: paper.title, published: publishedAt, description: paper.summary}
    url_template: "https://huggingface.co/papers/{paper.id}"

  # ───────────────────────── COMMUNITY (Reddit) ─────────────────────────
  # Reddit posts are unwrapped to the article they link to. Reddit sometimes rate-limits
  # cloud IPs; failures here are harmless.
  - name: r/artificial
    type: reddit
    url: https://www.reddit.com/r/artificial/top/.rss?t=day
    category: community
    priority: 4

  - name: r/Kenya tech
    type: reddit
    url: "https://www.reddit.com/r/Kenya/search.rss?q=AI+OR+tech+OR+Safaricom&restrict_sr=on&sort=new&t=week"
    category: kenya
    priority: 3
    enabled: false

