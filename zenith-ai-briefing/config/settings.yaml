  - topic: OpenAI agents
    keywords: [openai agent, operator, agentkit, codex, chatgpt agent]
  - topic: Anthropic models
    keywords: [anthropic, claude]
  - topic: Google Gemini
    keywords: [gemini, deepmind]
  - topic: AI advertising
    keywords: [ai ads, advertising, ad platform, performance max, meta advantage]
  - topic: AI video
    keywords: [sora, veo, ai video, runway, video generation]
  - topic: AI voice
    keywords: [voice agent, text-to-speech, speech model, elevenlabs, realtime api]
  - topic: AI sales automation
    keywords: [sales automation, crm, salesforce, hubspot, sdr, lead generation]
  - topic: AI customer service
    keywords: [customer service, customer support, contact center, chatbot, whatsapp business]
